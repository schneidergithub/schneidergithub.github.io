name: Prepare publication covers
on:
  push:
    branches: [feat/publication-video-players]
    paths: ['.github/workflows/prepare-publication-covers.yml']
permissions: {}
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Collect published thumbnail originals
        run: |
          mkdir -p covers
          python3 - <<'PY'
          import base64, io, pathlib, subprocess
          from PIL import Image
          urls = {
            'benchmark': 'https://i.ytimg.com/vi/e26_SSPpOP0/mqdefault.jpg',
            'node-ipc-interview': 'https://i.ytimg.com/vi/TZ04u6cj1ls/mqdefault.jpg',
            'security-livestream': 'https://i.ytimg.com/vi/i0a7tXSLj3c/mqdefault.jpg',
            'august-review': 'https://media.licdn.com/dms/image/v2/D5612AQHYGgGZWl3dWQ/article-cover_image-shrink_720_1280/B56aBlbbvQGcAQ-/0/1788408086098?e=2147483647&t=UJ-YSpGI4NPoUpFRlJqCYNd-HAROKK7lpSNUwfkEOKE&v=beta',
            'july-review': 'https://media.licdn.com/dms/image/v2/D4E12AQHRj92f0M8Gsw/article-cover_image-shrink_720_1280/B4EZ_IJRO3HwAU-/0/1785769311767?e=2147483647&t=lIEJzoHtrle8lgpcGIGI3tPmKgfCN9WHgi_j0Nexd20&v=beta',
          }
          for name, url in urls.items():
              req = subprocess.run(['curl','-LsS','--fail','--max-time','12','--retry','1',url],capture_output=True)
              if req.returncode:
                  print(name, req.stderr.decode())
                  continue
              img = Image.open(io.BytesIO(req.stdout)).convert('RGB')
              assert img.width >= 300
              img.thumbnail((400,260),Image.Resampling.LANCZOS)
              path = pathlib.Path('covers') / (name + '.jpg')
              img.save(path,quality=83,optimize=True)
          PY
      - name: Capture September issue masthead
        run: |
          curl -fsSL --max-time 12 https://www.aaronschneider.org/common-devops-reports/reports/2026-09/ -o /tmp/september.html
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1100,800 --screenshot=/tmp/issue.png file:///tmp/september.html
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/issue.png').convert('RGB')
          # Masthead begins after the page's 36px top margin. Include publisher and headline.
          im=im.crop((50,53,600,294))
          im.resize((400,175),Image.Resampling.LANCZOS).save('covers/september-review.jpg',quality=87,optimize=True)
          PY
      - name: Export web-sized covers
        if: always()
        run: |
          python3 - <<'PY'
          import base64, pathlib
          for file in sorted(pathlib.Path('covers').glob('*.jpg')):
              data=base64.b64encode(file.read_bytes()).decode()
              for i in range(0,len(data),1600):
                  print('COVER-PART',file.stem,i,data[i:i+1600])
          PY
