name: Homepage visual review
on:
  push:
    branches: [qa/homepage-visual-review-20261121]
    paths: ['.github/workflows/homepage-visual-review.yml']
permissions: {}
jobs:
  capture:
    name: public homepage at ${{ matrix.width }}px
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        width: [375, 768, 1280]
    steps:
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/visual" --no-save --silent playwright-core@1.55.0
      - name: Capture public homepage
        env:
          NODE_PATH: ${{ runner.temp }}/visual/node_modules
          REVIEW_WIDTH: ${{ matrix.width }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('node:fs');
          const width=Number(process.env.REVIEW_WIDTH);
          const height=width===375 ? 812 : width===768 ? 1024 : 900;
          (async()=>{
            const browser=await chromium.launch({channel:'chrome'});
            try {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const result=await page.goto('https://www.aaronschneider.org/', {waitUntil:'networkidle'});
              if(!result.ok()) throw Error('HTTP ' + result.status());
              const lazy=page.locator('main img');
              for(const img of await lazy.all()){
                await img.scrollIntoViewIfNeeded(); await img.evaluate(el=>el.decode());
              }
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.evaluate(()=>document.fonts.ready);
              console.log('PAGE',await page.title(),width,await lazy.count(),await page.locator('main h2').allTextContents());
              const top=await page.screenshot({type:'jpeg',quality:72});
              const media=page.locator('main section').filter({has:page.getByRole('heading',{name:/articles.*demos|featured media|research.*publications|writing.*demos/i})}).last();
              const fallback=page.locator('main section').last();
              const region=await media.count()?media:fallback;
              await region.evaluate(el=>el.scrollIntoView({block:'start',behavior:'instant'}));
              const mediaScreen=await page.screenshot({type:'jpeg',quality:68});
              const full=await page.screenshot({type:'jpeg',quality:63,fullPage:true});
              const sheet=await browser.newPage({viewport:{width:Math.min(width,960),height:1100},deviceScaleFactor:1});
              await sheet.setContent('<html><head><style>*{box-sizing:border-box}body{margin:0;background:#28303c;color:white;font:12px Arial}.layout{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;align-items:start}h2{margin:2px 0 6px;font-size:14px}img{display:block;width:100%;height:auto}</style></head><body><main class="layout"><section><h2>Homepage</h2><img src="data:image/jpeg;base64,'+full.toString('base64')+'"></section><section><h2>First screen</h2><img src="data:image/jpeg;base64,'+top.toString('base64')+'"><h2>Media section</h2><img src="data:image/jpeg;base64,'+mediaScreen.toString('base64')+'"></section></main></body></html>');
              const overview=await sheet.locator('main').screenshot({type:'jpeg',quality:52});
              for(const [label,bytes] of Object.entries({top,media:mediaScreen,overview})){
                const encoded=bytes.toString('base64');
                console.log('VISUAL-SIZE',label,bytes.length);
                for(let i=0;i<encoded.length;i+=1600)console.log('VISUAL-CHUNK',label,i,encoded.slice(i,i+1600));
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
